apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

group='com.github.Polidea'

repositories {
    google()
    mavenCentral()
    mavenLocal()
    maven { url "https://jitpack.io" }
}

android {
    compileSdkVersion 28
    namespace 'com.polidea.multiplatformbleadapter'

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 28
        versionCode 1
        versionName "1.0"
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        profile {
            matchingFallbacks = ['debug', 'release']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "com.github.resideo.rxandroidble:rxandroidble:1.0.0"
    implementation 'com.android.support:support-annotations:28.0.0'
    implementation 'io.reactivex:rxjava:1.3.8'
    implementation 'com.jakewharton.rxrelay:rxrelay:1.2.0'
    testImplementation 'junit:junit:4.12'
}

task sourcesJar(type: Jar) {
    classifier = 'sources'
    from android.sourceSets.main.java.sourceFiles
}

artifacts {
    archives sourcesJar
}

// Add dummy AAR tasks for Flutter module builds
// Flutter's aar_init_script expects these tasks to exist
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.resideo.multiplatformbleadapter'
                artifactId = 'multiplatformbleadapter'
                version = '1.0.0'
            }
        }
    }
    tasks.register('assembleAarDebug') {
        dependsOn tasks.named('assembleDebug')
    }

    tasks.register('assembleAarProfile') {
        dependsOn tasks.named('assembleRelease')
    }

    tasks.register('assembleAarRelease') {
        dependsOn tasks.named('assembleRelease')
    }
}

// Publishing configuration removed to avoid compatibility issues
// apply from: '../gradle/publish_github.gradle'
